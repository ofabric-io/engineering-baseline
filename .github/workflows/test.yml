name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Render sample projects and run their checks
        run: node tests/render.mjs
